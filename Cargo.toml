[package]
name = "evidence-ledger"
version = "0.1.0"
edition = "2021"
rust-version = "1.84"
description = "TWZRD evidence ledger: append-only on-chain registry of merkle roots over signed receipt and attestation leaves"
license = "MIT"

[lib]
crate-type = ["cdylib", "lib"]

[features]
default = []
localtest = []

[dependencies]
pinocchio = "0.9"

[dev-dependencies]
litesvm = { version = "0.10", features = ["precompiles"] }
# solana-sdk 2.2.1 pulls solana-keypair 2.2.3, which requires ed25519-dalek
# 1.0.1, curve25519-dalek 3.2.0, and rand 0.7.3. The patched releases are
# majors that crate cannot resolve (dalek 2, curve25519-dalek 4.1.3, rand
# 0.8.6). solana-keypair 3.1.2 already brings the patched dalek 2 line.
# Dependabot security updates for those three names fail with
# security_update_not_possible. Do not bump them on their own.
solana-sdk = "=2.2.1"
solana-account = "=3.4.0"
solana-address = "=2.2.0"
solana-instruction = "=3.2.0"
solana-keypair = "=3.1.2"
solana-message = "=3.1.0"
solana-signer = "=3.0.0"
solana-transaction = "=3.1.0"
solana-ed25519-program = "=2.2.3"
sha2 = "0.10"
sha3 = "0.10"
solana-system-interface = "1.0"

[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1
opt-level = 3
strip = true
panic = "abort"
